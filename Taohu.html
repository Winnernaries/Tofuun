<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>กดแมว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
 
  body {
    min-height: 100vh;
    font-family: "Sarabun", "Noto Sans Thai", sans-serif;
    overflow: hidden;
    background: #faf7f2;
    transition: background .6s;
  }
  body.flower-mode { background: #fff3b8; }
 
  .page {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .hidden { display: none !important; }
 
  /* =====================================================
     หน้า 1 : เต้าหู้ (มินิมอล)
     ===================================================== */
  #page-tofu::before {              /* กรอบเส้นบางๆ รอบหน้า */
    content: "";
    position: absolute;
    inset: 22px;
    border: 1px solid #e8dfcf;
    border-radius: 28px;
    pointer-events: none;
  }
 
  .dot {                            /* จุดเล็กๆ ประดับ */
    position: absolute;
    border-radius: 50%;
    background: #e6dac4;
    animation: twinkle 3.5s ease-in-out infinite;
  }
  .dot.d1 { width: 8px;  height: 8px;  top: 18%; left: 20%; }
  .dot.d2 { width: 5px;  height: 5px;  top: 28%; right: 22%; animation-delay: .8s; }
  .dot.d3 { width: 10px; height: 10px; bottom: 24%; left: 26%; animation-delay: 1.6s; }
  .dot.d4 { width: 6px;  height: 6px;  bottom: 30%; right: 18%; animation-delay: 2.2s; }
  .dot.d5 { width: 4px;  height: 4px;  top: 14%; right: 38%; animation-delay: 1.2s; }
 
  .stage {
    position: relative;
    width: 300px;
    height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage::before {                  /* วงกลมสีอ่อนด้านหลังเต้าหู้ */
    content: "";
    position: absolute;
    width: 270px;
    height: 270px;
    border-radius: 50%;
    background: #f1eadc;
  }
  .stage::after {                   /* วงแหวนบางๆ */
    content: "";
    position: absolute;
    width: 310px;
    height: 310px;
    border-radius: 50%;
    border: 1px dashed #dccfb6;
    animation: spin 40s linear infinite;
  }
  .shadow {                         /* เงาใต้เต้าหู้ */
    position: absolute;
    bottom: 38px;
    width: 120px;
    height: 14px;
    border-radius: 50%;
    background: rgba(120, 95, 55, .15);
    filter: blur(4px);
    animation: shadow 2.8s ease-in-out infinite;
  }
 
  /* ช่องใส่รูปเต้าหู้ (GIF) */
  .tofu-wrap {
    position: relative;
    z-index: 2;
    width: 200px;
    height: 200px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .25s;
    animation: float 2.8s ease-in-out infinite;
  }
  .tofu-wrap:hover { transform: scale(1.07); }
  .tofu-wrap.clicked { animation: squish .5s forwards; }
  .tofu-wrap img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }
 
  .tofu-svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
    filter: drop-shadow(0 6px 8px rgba(120, 95, 55, .12));
  }
  .tofu-svg .eye {                  /* กะพริบตา */
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 4.5s infinite;
  }
  .tofu-svg .spark {                /* ประกายระยิบ */
    transform-box: fill-box;
    transform-origin: center;
    animation: sparkle 2.4s ease-in-out infinite;
  }
  .tofu-svg .spark.s2 { animation-delay: 1.1s; }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    96%           { transform: scaleY(.1); }
  }
  @keyframes sparkle {
    0%, 100% { transform: scale(.5) rotate(0);   opacity: .5; }
    50%      { transform: scale(1.1) rotate(25deg); opacity: 1; }
  }
 
  /* เต้าหู้สำรอง (ใช้เมื่อเปลี่ยนไปใช้รูป GIF แล้วรูปโหลดไม่ขึ้น) */
  .tofu-placeholder {
    display: none;
    width: 140px;
    height: 140px;
    background: linear-gradient(145deg, #fffdf6, #f3ead0);
    border-radius: 18px;
    box-shadow: 0 8px 20px rgba(0,0,0,.1), inset 0 -6px 0 rgba(0,0,0,.04);
    position: relative;
  }
  .tofu-placeholder::before, .tofu-placeholder::after {
    content: "";
    position: absolute;
    top: 54px;
    width: 10px; height: 10px;
    background: #4a4036;
    border-radius: 50%;
  }
  .tofu-placeholder::before { left: 40px; }
  .tofu-placeholder::after  { right: 40px; }
 
  .text {
    margin-top: 26px;
    font-size: 1.6rem;
    font-weight: 300;
    letter-spacing: .35em;
    padding-left: .35em;
    color: #7d6e58;
    text-align: center;
  }
  .hint {                           /* ลูกศรเล็กๆ ชี้ขึ้น */
    margin-top: 10px;
    width: 1px;
    height: 26px;
    background: linear-gradient(#cdbfa6, transparent);
    position: relative;
    animation: nudge 1.8s ease-in-out infinite;
  }
  .hint::before {
    content: "";
    position: absolute;
    top: -1px;
    left: -3px;
    width: 7px;
    height: 7px;
    border-left: 1px solid #b9a98d;
    border-top: 1px solid #b9a98d;
    transform: rotate(45deg);
  }
 
  @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes shadow  { 0%,100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.8); opacity: .6; } }
  @keyframes twinkle { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.4); } }
  @keyframes spin    { to { transform: rotate(360deg); } }
  @keyframes nudge   { 0%,100% { transform: translateY(0); opacity: .6; } 50% { transform: translateY(-6px); opacity: 1; } }
  @keyframes squish  {
    0%   { transform: scale(1, 1); }
    40%  { transform: scale(1.3, .6); }
    100% { transform: scale(0, 0); opacity: 0; }
  }
 
  /* =====================================================
     หน้า 2 : ดอกไม้ (น่ารักๆ)
     ===================================================== */
  #page-flower {
    animation: fadeIn .9s;
    background:
      radial-gradient(circle, rgba(255,255,255,.75) 3px, transparent 3.5px) 0 0 / 34px 34px,
      radial-gradient(circle, rgba(255,214,90,.35) 2px, transparent 2.5px) 17px 17px / 34px 34px,
      linear-gradient(180deg, #fff6c9, #ffe58a);
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
 
  /* ดอกไม้ประดับมุมจอ */
  .corner {
    position: absolute;
    pointer-events: none;
    z-index: 1;
    animation: spin 40s linear infinite;
  }
  .corner svg { width: 100%; height: 100%; display: block; }
  .corner.c1 { width: 190px; height: 190px; top: -70px;  left: -70px; }
  .corner.c2 { width: 150px; height: 150px; top: -50px;  right: -50px; animation-direction: reverse; }
  .corner.c3 { width: 160px; height: 160px; bottom: -60px; left: -50px; animation-direction: reverse; }
  .corner.c4 { width: 200px; height: 200px; bottom: -80px; right: -70px; }
  .corner.s1 { width: 54px; height: 54px; top: 17%;    left: 10%;  animation-duration: 18s; }
  .corner.s2 { width: 40px; height: 40px; top: 22%;    right: 11%; animation-duration: 22s; }
  .corner.s3 { width: 46px; height: 46px; bottom: 18%; left: 12%;  animation-duration: 26s; }
  .corner.s4 { width: 34px; height: 34px; bottom: 24%; right: 9%;  animation-duration: 20s; }
 
  /* ตัวหนังสือ/อีโมจิลอยๆ */
  .float-deco {
    position: absolute;
    z-index: 1;
    font-size: 1.6rem;
    pointer-events: none;
    animation: bob 3.2s ease-in-out infinite;
  }
  .float-deco.f1 { top: 12%;    left: 30%; }
  .float-deco.f2 { top: 14%;    right: 28%; animation-delay: .6s; }
  .float-deco.f3 { bottom: 12%; left: 32%;  animation-delay: 1.2s; }
  .float-deco.f4 { bottom: 14%; right: 30%; animation-delay: 1.8s; }
  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(-6deg); }
    50%     { transform: translateY(-12px) rotate(6deg); }
  }
 
  /* กรอบรูปแบบโพลารอยด์ ช่องใส่รูปดอกไม้ */
  .flower-box {
    position: relative;
    z-index: 3;
    background: #fffdf6;
    padding: 14px 14px 18px;
    border-radius: 22px;
    box-shadow: 0 14px 34px rgba(190, 140, 20, .28), 0 0 0 5px #fff;
    transform: rotate(-2deg);
    text-align: center;
    animation: sway-frame 5s ease-in-out infinite;
  }
  .flower-box::before,
  .flower-box::after {              /* เทปกาวติดมุม */
    content: "";
    position: absolute;
    top: -14px;
    width: 74px;
    height: 26px;
    background: rgba(255, 190, 200, .75);
    border-radius: 4px;
    box-shadow: 0 2px 4px rgba(0,0,0,.08);
  }
  .flower-box::before { left: -20px;  transform: rotate(-35deg); }
  .flower-box::after  { right: -20px; transform: rotate(35deg); background: rgba(190, 225, 255, .8); }
  @keyframes sway-frame {
    0%,100% { transform: rotate(-2deg); }
    50%     { transform: rotate(2deg); }
  }
 
  .flower-box img {
    max-width: min(440px, 76vw);
    max-height: 56vh;
    object-fit: contain;
    border-radius: 14px;
    display: block;
  }
  .flower-placeholder {
    display: none;
    width: min(340px, 70vw);
    height: 260px;
    border: 3px dashed #f0b400;
    border-radius: 14px;
    align-items: center;
    justify-content: center;
    color: #b58600;
    font-family: "Mali", cursive;
    font-size: 1.2rem;
    background: #fff9dd;
  }
  .sunflower {
    width: min(340px, 72vw);
    height: auto;
    max-height: 56vh;
    display: block;
    margin: 0 auto;
    background: #fff9dd;
    border-radius: 14px;
  }
  #petals {                         /* กลีบหมุนช้าๆ */
    transform-origin: 200px 170px;
    animation: spin 70s linear infinite;
  }
  .caption {
    margin-top: 14px;
    font-family: "Mali", cursive;
    font-weight: 600;
    font-size: 1.35rem;
    color: #c48a00;
  }
 
  /* ดอกไม้เหลืองที่ตกลงมา */
  .petal {
    position: fixed;
    top: -60px;
    z-index: 2;
    pointer-events: none;
    animation-name: fall, sway;
    animation-timing-function: linear, ease-in-out;
    animation-iteration-count: 1, infinite;
    animation-fill-mode: forwards, none;
  }
  .petal svg { width: 100%; height: 100%; display: block; }
  @keyframes fall { to { top: 110vh; } }
  @keyframes sway {
    0%,100% { transform: translateX(-25px) rotate(-20deg); }
    50%     { transform: translateX(25px)  rotate(20deg); }
  }
</style>
</head>
<body>
 
  <!-- แม่แบบดอกไม้เหลือง (ใช้ซ้ำทั้งหน้า) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="flower" viewBox="0 0 100 100">
      <g fill="#FFD21F" stroke="#E6A800" stroke-width="2">
        <ellipse cx="50" cy="24" rx="15" ry="22"/>
        <ellipse cx="50" cy="24" rx="15" ry="22" transform="rotate(72 50 50)"/>
        <ellipse cx="50" cy="24" rx="15" ry="22" transform="rotate(144 50 50)"/>
        <ellipse cx="50" cy="24" rx="15" ry="22" transform="rotate(216 50 50)"/>
        <ellipse cx="50" cy="24" rx="15" ry="22" transform="rotate(288 50 50)"/>
      </g>
      <circle cx="50" cy="50" r="11" fill="#FF9F1C"/>
      <circle cx="46" cy="47" r="2.5" fill="#fff" opacity=".7"/>
    </symbol>
  </svg>
 
  <!-- ========== หน้า 1 : เต้าหู้ ========== -->
  <div class="page" id="page-tofu">
    <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span>
    <span class="dot d4"></span><span class="dot d5"></span>
 
    <div class="stage">
      <div class="shadow"></div>
      <div class="tofu-wrap" id="tofu">
        <!-- 🧈 เต้าหู้น่ารักวาดด้วย SVG (ถ้าอยากใช้ GIF ของตัวเอง ลบ <svg> นี้ แล้วใส่ <img src="tofu.gif"> แทน) -->
        <img src="meoww.jpg" alt=>
      </div>
    </div>
 
    <div class="text">กดแมว</div>
    <div class="hint"></div>
  </div>
 
  <!-- ========== หน้า 2 : ดอกไม้ ========== -->
  <div class="page hidden" id="page-flower">
    <!-- ดอกไม้ประดับมุมจอ -->
    <div class="corner c1"><svg><use href="#flower"/></svg></div>
    <div class="corner c2"><svg><use href="#flower"/></svg></div>
    <div class="corner c3"><svg><use href="#flower"/></svg></div>
    <div class="corner c4"><svg><use href="#flower"/></svg></div>
    <div class="corner s1"><svg><use href="#flower"/></svg></div>
    <div class="corner s2"><svg><use href="#flower"/></svg></div>
    <div class="corner s3"><svg><use href="#flower"/></svg></div>
    <div class="corner s4"><svg><use href="#flower"/></svg></div>
 
    <!-- ของลอยๆ น่ารักๆ -->
    <span class="float-deco f1">✨</span>
    <span class="float-deco f2">💛</span>
    <span class="float-deco f3">🐝</span>
    <span class="float-deco f4">✨</span>
 
    <div class="flower-box">
      <!-- 🌻 ทานตะวันวาดด้วย SVG (ถ้าอยากใช้รูปของตัวเอง ลบ <svg> นี้ แล้วใส่ <img src="flower.jpg"> แทน) -->
      <svg class="sunflower" viewBox="0 0 400 470" role="img" aria-label="ดอกทานตะวัน">
        <defs>
          <radialGradient id="disc" cx="50%" cy="45%" r="60%">
            <stop offset="0" stop-color="#9a6531"/>
            <stop offset=".7" stop-color="#5f3a17"/>
            <stop offset="1" stop-color="#3e2410"/>
          </radialGradient>
          <linearGradient id="stemG" x1="0" x2="1">
            <stop offset="0" stop-color="#4f9a33"/>
            <stop offset="1" stop-color="#6cbb45"/>
          </linearGradient>
        </defs>
 
        <!-- ก้าน -->
        <path d="M200 240 C 188 320, 214 400, 200 470" stroke="url(#stemG)" stroke-width="16" fill="none" stroke-linecap="round"/>
        <!-- ใบ -->
        <path d="M204 385 C 262 345, 322 355, 345 312 C 300 300, 232 312, 204 385 Z" fill="#6cbb45" stroke="#4f9a33" stroke-width="3" stroke-linejoin="round"/>
        <path d="M208 378 C 250 352, 290 340, 322 326" stroke="#4f9a33" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M197 410 C 140 372, 80 382, 55 340 C 100 328, 170 340, 197 410 Z" fill="#7ccb52" stroke="#4f9a33" stroke-width="3" stroke-linejoin="round"/>
        <path d="M192 402 C 150 376, 112 362, 78 350" stroke="#4f9a33" stroke-width="3" fill="none" stroke-linecap="round"/>
 
        <!-- กลีบ (สร้างด้วย JS) -->
        <g id="petals"></g>
 
        <!-- จานกลางดอก -->
        <circle cx="200" cy="170" r="64" fill="url(#disc)" stroke="#3e2410" stroke-width="4"/>
        <g id="seeds"></g>
 
        <!-- หน้ายิ้มน่ารัก (ไม่เอา ลบกลุ่มนี้ทิ้งได้) -->
        <g id="face">
          <circle cx="177" cy="165" r="7" fill="#fff6d6"/>
          <circle cx="223" cy="165" r="7" fill="#fff6d6"/>
          <circle cx="179" cy="162.5" r="2.5" fill="#5f3a17"/>
          <circle cx="225" cy="162.5" r="2.5" fill="#5f3a17"/>
          <path d="M185 183 Q200 199 215 183" stroke="#fff6d6" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          <circle cx="162" cy="182" r="9" fill="#ff8f8f" opacity=".65"/>
          <circle cx="238" cy="182" r="9" fill="#ff8f8f" opacity=".65"/>
        </g>
      </svg>
      <!-- 👇 แก้ข้อความใต้รูปได้ตรงนี้ -->
      <div class="caption">🌼 ไม่มีละเดซี่ วันนี้ 🌼</div>
    </div>
  </div>
 
<script>
  const tofu = document.getElementById('tofu');
  const pageTofu = document.getElementById('page-tofu');
  const pageFlower = document.getElementById('page-flower');
 
  // กดเต้าหู้ -> สลับไปหน้าดอกไม้
  tofu.addEventListener('click', () => {
    tofu.classList.add('clicked');
    setTimeout(() => {
      pageTofu.classList.add('hidden');
      pageFlower.classList.remove('hidden');
      document.body.classList.add('flower-mode');
      document.title = 'ดอกไม้';
      startFlowers();
    }, 500);
  });
 
  // ===== วาดกลีบและเมล็ดทานตะวัน =====
  (function buildSunflower() {
    const NS = 'http://www.w3.org/2000/svg';
    const cx = 200, cy = 170;
    const petals = document.getElementById('petals');
    const seeds = document.getElementById('seeds');
 
    function addPetals(count, offsetDeg, dist, ry, fill, stroke) {
      for (let i = 0; i < count; i++) {
        const e = document.createElementNS(NS, 'ellipse');
        e.setAttribute('cx', cx);
        e.setAttribute('cy', cy - dist);
        e.setAttribute('rx', 17);
        e.setAttribute('ry', ry);
        e.setAttribute('fill', fill);
        e.setAttribute('stroke', stroke);
        e.setAttribute('stroke-width', 2.5);
        e.setAttribute('transform', `rotate(${offsetDeg + i * 360 / count} ${cx} ${cy})`);
        petals.appendChild(e);
      }
    }
    addPetals(16, 11.25, 98, 40, '#F5A800', '#DC9200');  // กลีบหลัง
    addPetals(16, 0,     90, 37, '#FFD21F', '#EFB300');  // กลีบหน้า
 
    // เมล็ดเรียงแบบก้นหอย (golden angle)
    const golden = Math.PI * (3 - Math.sqrt(5));
    for (let i = 1; i <= 130; i++) {
      const r = 4.6 * Math.sqrt(i);
      const a = i * golden;
      const d = document.createElementNS(NS, 'circle');
      d.setAttribute('cx', cx + r * Math.cos(a));
      d.setAttribute('cy', cy + r * Math.sin(a));
      d.setAttribute('r', 2.2);
      d.setAttribute('fill', i % 2 ? '#7a4d22' : '#4a2c12');
      d.setAttribute('opacity', .8);
      seeds.appendChild(d);
    }
  })();
 
  function spawnFlower() {
    const el = document.createElement('div');
    el.className = 'petal';
    el.innerHTML = '<svg viewBox="0 0 100 100"><use href="#flower"/></svg>';
 
    const size = 18 + Math.random() * 30;       // ขนาด 18–48px
    const fallTime = 5 + Math.random() * 6;     // ตกใช้เวลา 5–11 วินาที
    const swayTime = 2 + Math.random() * 2;     // แกว่งซ้ายขวา
 
    el.style.width = el.style.height = size + 'px';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.opacity = 0.75 + Math.random() * 0.25;
    el.style.animationDuration = fallTime + 's, ' + swayTime + 's';
 
    document.body.appendChild(el);
    setTimeout(() => el.remove(), fallTime * 1000);
  }
 
  function startFlowers() {
    for (let i = 0; i < 15; i++) setTimeout(spawnFlower, i * 150);
    setInterval(spawnFlower, 300);
  }
</script>
</body>
</html>
